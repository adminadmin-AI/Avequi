name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela runs antigos do mesmo branch/PR quando chega um novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      # O build (tsc/nest build) precisa do Prisma Client gerado. Não há
      # postinstall — geramos explicitamente (foi a causa de build quebrado antes).
      - name: Prisma generate
        run: npm run db:generate --workspace=apps/api

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
